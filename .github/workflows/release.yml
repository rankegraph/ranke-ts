name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Build, not verify. The tag is cut from a commit the pull request already
      # verified, so checking it again here would re-answer a settled question. This
      # step is here because dist/ is gitignored and package.json ships `files:
      # ["dist"]` — without it npm publish would upload a package with nothing in it.
      - name: Build what gets published
        run: make build

      # The tag carries the version; package.json stays at 0.0.0 in the tree so
      # no commit has to be cut to bump it.
      - name: Set version from the tag
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      # A scoped package defaults to restricted, hence --access public.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
