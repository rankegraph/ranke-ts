name: CI

# The test gate the Makefile's `release` target assumes exists. Every push and
# every PR, so a tag is only ever cut from a tested main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # package.json's engines field is the single source of truth for the
      # floor; the tests run on it, so a construct newer than that fails here.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test

      - name: Build
        run: make build

      # The spec the rule-citation gate reads lives in ranke-graph, so it is
      # infrastructure: fetched, never skipped. The gate fails without it rather than
      # passing blind.
      - name: Fetch the spec
        run: make docs

      # Every rule id a comment cites is one the spec declares. Needs the spec above.
      - name: Rule citations
        run: make rule-citations
