name: CI

# The test gate the Makefile's `release` target assumes exists, and the check branch
# protection requires — so the job stays named `test`, which is what release.sh waits on.
#
# On the pull request alone. GitHub runs this against the merge of head into base, so a
# green run is a verdict on the tree the merge produces: what lands on the default branch
# has been verified, and re-running it there would re-answer a settled question. The
# default branch takes commits no other way, being protected.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # package.json's engines field is the single source of truth for the
      # floor; the tests run on it, so a construct newer than that fails here.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      # `make verify` rather than its parts, and now the only run of it CI does. This job
      # is the check a merge waits on, so anything it omits is a gate that cannot stop
      # what it was written to stop — check-generated was once absent from the list here
      # while running everywhere else, which is the one place that could have refused the
      # merge. Naming the target instead of its contents leaves nothing to keep in step.
      #
      # It fetches the spec and the published vectors itself, so nothing is cached
      # between runs and a moved spec is a red run here rather than a surprise later.
      - name: Verify
        run: make verify
