name: CI

# The test gate the Makefile's `release` target assumes exists. Every push and
# every PR, so a tag is only ever cut from a tested main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # package.json's engines field is the single source of truth for the
      # floor; the tests run on it, so a construct newer than that fails here.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      # `make verify` rather than its parts. This job is the check a PR merge waits on,
      # so anything it omits is a gate that cannot stop what it was written to stop —
      # which is how check-generated came to run locally and at tag time but not here,
      # on the one leg that could have refused the merge. Naming the target instead of
      # its contents leaves nothing to keep in step.
      #
      # It fetches the spec and the published vectors itself, so nothing is cached
      # between runs and a moved spec is a red run here rather than a surprise later.
      - name: Verify
        run: make verify
